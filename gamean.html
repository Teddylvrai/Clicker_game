<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <script src="assets/js/scriptan.js" defer></script>
</head>
<body>
    <header>
        <a href="game.html">🏴󠁧󠁢󠁥󠁮󠁧󠁿</a>
        <h1>Clicker Game</h1>
        <a href="https://github.com/Teddylvrai">My GitHub</a>
    </header>
    <main>
        <div class="maingame">
            <h2 id="compteur"></h2>
            <h3 id="argent"></h3>
            <button id="clicker">
                Click me
            </button>
            <button id="vente">
                Sell clicks
            </button>
            <p id="limite"></p>
        </div>
        <h2>Upgrade Shop</h2>
        <section class="upgrade-container">
            <div class="upgrade-1" id="box-upgrade-1" style="display: none;">
                <h4>Limit Boost</h4>
                <p>100 => 500</p>
                <p>500 $</p>
                <button id="achat-1">Buy</button>
            </div>
            <div class="upgrade-2" id="box-upgrade-2" style="display: none;">
                <h4>Click Boost</h4>
                <p>1 => 5</p>
                <p>500 $</p>
                <button id="achat-2">Buy</button>
            </div>
            <div class="upgrade-3" id="box-upgrade-3" style="display: none;">
                <h4>Limit Boost 2</h4>
                <p>500 => 1000</p>
                <p>1000 $</p>
                <button id="achat-3">Buy</button>
            </div>
            <div class="upgrade-4" id="box-upgrade-4" style="display: none;">
                <h4>Autoclicker Lv.1</h4>
                <p>1click/2s</p>
                <p>1500 $</p>
                <button id="achat-4">Buy</button>
            </div>
        </section>  
    </main>
</body>
</html>
