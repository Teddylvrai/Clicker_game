<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="assets/css/menu.css">
    <link rel="stylesheet" href="assets/css/background.css">
</head>
<body>
    <div class="game-bg">
        <!-- Grille -->
        <div class="grid-overlay"></div>
        
        <!-- Cercles pulsants -->
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        
        <!-- Particules lumineuses -->
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        
        <!-- Traits de lumière -->
        <div class="light-line"></div>
        <div class="light-line"></div>
        <div class="light-line"></div>
        
        <!-- Lueurs d'ambiance -->
        <div class="ambient-glow"></div>
        <div class="ambient-glow"></div>
        <div class="ambient-glow"></div>
        
        <!-- Score flottant (décoratif) -->
        <div class="score-particles">+1</div>
        <div class="score-particles">+5</div>
        <div class="score-particles">+10</div>
        <div class="score-particles">+2</div>
        <div class="score-particles">+7</div>
    </div>
    
    <div class="main-div">
        <h1>🎮 Clicker Game</h1>
        <h2>Hope on your game adventure</h2>
        <a href="game.html">
            <button class="button-with-icon">
                <svg class="icon" id="Play" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path class="color000000 svgShape" fill="#ffffff" d="M12 39c-.549 0-1.095-.15-1.578-.447A3.008 3.008 0 0 1 9 36V12c0-1.041.54-2.007 1.422-2.553a3.014 3.014 0 0 1 2.919-.132l24 12a3.003 3.003 0 0 1 0 5.37l-24 12c-.42.21-.885.315-1.341.315z"></path>
                </svg>
                <span class="text">Play</span>
            </button>
        </a>
    </div>
</body>
</html>
